# Bases de datos para desarrollo local (microservicios desde IntelliJ + ng serve)
# Uso:  docker compose up -d
# Las credenciales se leen del fichero .env que está junto a este archivo.

services:
  auth-db:
    image: postgres:16
    container_name: auth-db-local
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data

  facturacion-db:
    image: postgres:16
    container_name: facturacion-db-local
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: fact_user
      POSTGRES_PASSWORD: ${FACTURACION_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - facturacion-data:/var/lib/postgresql/data

  document-db:
    image: postgres:16
    container_name: document-db-local
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - document-data:/var/lib/postgresql/data

   kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init-local
    depends_on:
      - kafka
    command: >
      /bin/sh -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic clientes.eventos --partitions 3 --replication-factor 1
      "

  volumes:
    auth-data:
    facturacion-data:
    document-data:

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clientes-postgres-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.clientesPostgres.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientes-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clientes-postgres
  template:
    metadata:
      labels:
        app: clientes-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.clientesPostgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.clientesPostgres.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.clientesPostgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: clientes-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: clientes-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: clientes-postgres
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: clientes-postgres
  ports:
    - port: 5432
      targetPort: 5432
